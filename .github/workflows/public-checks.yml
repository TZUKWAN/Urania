name: Public source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '25.6.0'
      - name: Syntax, fixed resources, versions and release manifest
        run: node scripts/check-public-source.mjs
      - name: Public persistence, path, source and security contracts
        run: node scripts/ci-portable.mjs
      - name: Credential scan including source archives
        shell: pwsh
        run: ./scripts/check-secrets.ps1
