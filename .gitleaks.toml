title = "Urania reviewed public-source false positives"
[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Exact comparison to public metadata attribute name in archived engine source"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)docs/engine-source-snapshots-ui150\.zip!vectorcraft-host/crates/engine/src/cmd/place/legacy_svg\.rs$''']
regexes = ['''^\s*if node\.extras\(\)\.attrs\.as_ref\(\)\.is_some_and\(\|a\| a\.data\.iter\(\)\.any\(\|\(key, _\)\| key == "dsh-material-v1"\)\) \{\s*$''']

